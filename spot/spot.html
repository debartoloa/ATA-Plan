    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #020617;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Warp tunnel effect */
    .warp-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(99, 102, 241, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(99, 102, 241, 0.15) 1px, transparent 1px);
      perspective: 600px;
      transform-style: preserve-3d;
    }

    /* Glow pulse */
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.45)); }
      50% { filter: drop-shadow(0 0 55px rgba(56, 189, 248, 0.75)); }
    }
    .glow-phone {
      animation: glowPulse 3.5s infinite ease-in-out;
    }

    /* Teleport flash */
    @keyframes teleportFlash {
      0% { opacity: 0; transform: scale(0.85); filter: blur(20px) brightness(2.5); }
      40% { opacity: 1; transform: scale(1.04); filter: blur(0px) brightness(1.2); }
      100% { opacity: 1; transform: scale(1); filter: blur(0px) brightness(1); }
    }
    .teleport-in {
      animation: teleportFlash 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Speed lines */
    .speed-line {
      position: absolute;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.8), transparent);
      height: 2px;
      border-radius: 9999px;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>

  <!-- Audio Synthesis (Web Audio API: Whoosh, Warp, Bass Drop) -->
  <script>
    class SFXController {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playWhoosh() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.18);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.45);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(600, now);
        filter.frequency.linearRampToValueAtTime(3200, now + 0.2);
        filter.frequency.linearRampToValueAtTime(300, now + 0.45);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.45);
      }
      playTeleportDrop() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        
        // Sub bass hit
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.6);

        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.7);

        // High shimmer
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(880, now);
        osc2.frequency.exponentialRampToValueAtTime(1760, now + 0.25);
        gain2.gain.setValueAtTime(0.18, now);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc2.connect(gain2);
        gain2.connect(this.ctx.destination);
        osc2.start(now);
        osc2.stop(now + 0.35);
      }
      playChime() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.15, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.5);
        });
      }
    }

    const sfx = new SFXController();
  </script>

    // Trigger visual teleport transition

      sfx.playWhoosh();

      flashOverlay.style.opacity = '0.9';

      // Update Scene Pill active states
      dots.forEach((dot, dIdx) => {
        if (dIdx === idx) {
          dot.className = 'scene-dot px-2.5 py-1 rounded-xl bg-indigo-600 text-white font-bold transition';
        } else {
          dot.className = 'scene-dot px-2.5 py-1 rounded-xl bg-slate-800 text-slate-400 hover:text-slate-200 transition';
        }
      });

      // Render content
      sceneHost.innerHTML = scene.render();

      // Background ambient colors
      const orb3 = document.getElementById('orb-3');
      if (idx === 2 || idx === 3) {
        orb3.style.opacity = '0.7';
      } else {
        orb3.style.opacity = '0';
      }

      // Update progress bar
      let elapsed = 0;
      for (let i = 0; i < idx; i++) elapsed += SCENES[i].duration;
      const pct = (elapsed / totalDuration) * 100;
      timelineProgress.style.width = `${pct}%`;
    }

    function nextScene() {
      if (currentSceneIdx < SCENES.length - 1) {
        triggerTeleportFX(currentSceneIdx + 1);
        renderScene(currentSceneIdx + 1);
        scheduleNext();
      } else {
        // End of spot
        stopPlayback();
        timelineProgress.style.width = '100%';
      }
    }

    function scheduleNext() {
      clearTimeout(sceneTimer);
      const currentDuration = SCENES[currentSceneIdx].duration;
      sceneTimer = setTimeout(() => {
        if (isPlaying) {
          nextScene();
        }
      }, currentDuration);
    }

    function startPlayback() {
      sfx.init();
      isPlaying = true;
      playText.innerText = 'PAUSA WARP';
      playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      
      if (currentSceneIdx >= SCENES.length - 1) {
        currentSceneIdx = 0;
      }
      triggerTeleportFX(currentSceneIdx);
      renderScene(currentSceneIdx);
      scheduleNext();
    }

    function stopPlayback() {
      isPlaying = false;
      clearTimeout(sceneTimer);
      playText.innerText = 'AVVIA WARP SPOT';
      playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        stopPlayback();
      } else {
        startPlayback();
      }
    });

    // Scene Dot Manual Jump
    dots.forEach((dot) => {
      dot.addEventListener('click', (e) => {
        sfx.init();
        const targetIdx = parseInt(e.target.getAttribute('data-warp'), 10);
        triggerTeleportFX(targetIdx);
        renderScene(targetIdx);
        if (isPlaying) {
          scheduleNext();
        }
      });
    });

    // Sound Toggle
    soundBtn.addEventListener('click', () => {
      sfx.enabled = !sfx.enabled;
      soundBtn.style.opacity = sfx.enabled ? '1' : '0.4';
    });

    // Fullscreen Toggle
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Initial render
    renderScene(0);
  </script>
</body>
</html>
